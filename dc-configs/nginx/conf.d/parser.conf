    # BotManager API report endpoint - proxy to yiiapp via fastcgi
    location ^~ /BotManager/api/report {
        # No auth required for report endpoint
        root /var/www/web;
        fastcgi_pass yiiapp:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/web/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;

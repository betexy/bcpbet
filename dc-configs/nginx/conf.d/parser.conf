server {
    listen 80;

    server_name bcp.bet;

    root /var/www2/new;
    index index.php;

    #access_log /var/log/nginx/access_parser.log;
    access_log     /dev/stdout;
    #error_log  /var/log/nginx/error_parser.log;
    error_log     /dev/stderr;
	
    client_max_body_size 1m;

    # permanent
    location /123456789/ {
	  try_files $internalUri $internalUri/ /index.php?$query_string;
	  gzip_static on;
    }
		
    # permanent
    location /premalp1/ {
	  try_files $internalUri $internalUri/ /index.php?$query_string;
	  gzip_static on;
    }

    # permanent
    location /alp1/ {
	  try_files $internalUri $internalUri/ /index.php?$query_string;
	  gzip_static on;
    }





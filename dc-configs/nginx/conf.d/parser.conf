server {
    listen 80;

    server_name bcp.bet;

    root /var/www2/new;
    index index.php;

    #access_log /var/log/nginx/access_parser.log;
    access_log     /dev/stdout;
    #error_log  /var/log/nginx/error_parser.log;
    error_log     /dev/stderr;
	
    client_max_body_size 1m;

    # New parser API endpoint with Redis locks and distributed queue
    # JWT authentication works the same way as in old parser - bots send JWT tokens
    # in Authorization header, and requests are processed (JWT errors are logged but don't block requests)
    location /new/ {
        # Allow OPTIONS for CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, X-Client-Id, Content-Type' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
        
        # Proxy to PHP-FPM (parserDaemon) - JWT is checked by nginx (same as old parser)
        fastcgi_pass parserDaemon:9000;
        fastcgi_index api.php;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri;
        
        # Pass X-Client-Id header to PHP
        fastcgi_param HTTP_X_CLIENT_ID $http_x_client_id;
        
        gzip_static on;
    }

    # permanent
    location /123456789/ {
	  try_files $internalUri $internalUri/ /index.php?$query_string;
	  gzip_static on;
    }
    # permanent
    location /abb_pairs_pre_stake/ {
